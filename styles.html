<style>
  /* 색 토큰: 이 값 외의 색은 쓰지 않는다. --red-pen 은 선생님 채점 표시·점수·정답·한 말씀·도장에만 */
  :root {
    --desk: #b9bfb3;
    --paper: #ebe6d6;
    --paper-shade: rgba(0, 0, 0, .05);
    --ink: #1f1f1d;
    --ink-soft: #3b3f37;
    --red-pen: #d6262b;
    --paper-dim: #d9d3c0; /* 선택 안 된 파일철 탭 */
    --paper-lift: rgba(255, 255, 255, .45); /* 입력 칸 바탕 */
    --font-title: 'Gowun Batang', serif;
    --font-body: 'Nanum Gothic', sans-serif;
    --font-pen: 'Nanum Pen Script', cursive;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body { margin: 0; padding: 0; }
  body {
    background: var(--desk);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 400;
    line-height: 1.6;
    padding: 18px 12px 48px;
  }
  .desk { background: var(--desk); }
  h1, h2, h3 { font-family: var(--font-title); font-weight: 700; margin: 0; }

  /* 갱지 한 장 */
  .paper {
    position: relative;
    max-width: 760px;
    margin: 0 auto;
    padding: 22px 22px 26px;
    background-color: var(--paper);
    background-image: radial-gradient(rgba(80, 70, 40, .06) 1px, transparent 1px);
    background-size: 3px 3px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
    font-size: 14px;
  }
  .paper--wide { max-width: 1180px; }
  .paper-title { font-family: var(--font-title); font-weight: 700; font-size: 22px; text-align: center; margin: 0 0 12px; }

  /* 검은 선 표 */
  .table-wrap { overflow-x: auto; }
  .sheet-table { width: 100%; border-collapse: collapse; }
  .sheet-table th, .sheet-table td { border: 1px solid var(--ink); padding: 6px 8px; text-align: left; vertical-align: middle; }
  .sheet-table th { background: var(--paper-shade); font-size: 12px; font-weight: 700; text-align: center; }
  .sheet-table td.num { width: 40px; text-align: center; font-weight: 800; }
  .sheet-table td.mark { width: 56px; text-align: center; }

  /* 버블: 단추 상자는 44px, 눈에 보이는 원은 34px */
  .bubble-group { display: inline-flex; flex-wrap: wrap; gap: 0 2px; vertical-align: middle; }
  .bubble {
    position: relative;
    width: 44px;
    height: 44px;
    padding: 5px;
    border: 0;
    border-radius: 50%;
    background-color: transparent;
    background-clip: content-box;
    color: var(--ink);
    font: 400 13px var(--font-body);
    cursor: pointer;
    transition: background-color .12s, color .12s;
  }
  .bubble::before {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    pointer-events: none;
  }
  .bubble[aria-pressed="true"] { background-color: var(--ink); color: var(--paper); }

  /* 입력 */
  .line-input {
    border: 0;
    border-bottom: 1px solid var(--ink);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: 400 16px var(--font-body);
    padding: 6px 2px;
    min-width: 120px;
  }
  .line-input:focus { background: var(--paper-lift); box-shadow: 0 1px 0 var(--ink); }
  .essay-input {
    display: block;
    width: 100%;
    min-height: 96px;
    border: 1px solid var(--ink);
    border-radius: 0;
    background: var(--paper-lift);
    color: var(--ink);
    font: 400 16px/1.7 var(--font-body);
    padding: 8px;
    resize: vertical;
  }

  /* 버튼과 링크 */
  .btn-ink, .btn-quiet {
    min-height: 44px;
    padding: 10px 24px;
    border: 1.5px solid var(--ink);
    border-radius: 2px;
    font: 700 14px var(--font-body);
    cursor: pointer;
  }
  .btn-ink { background: var(--ink); color: var(--paper); }
  .btn-quiet { background: transparent; color: var(--ink); }
  .btn-ink:disabled, .btn-quiet:disabled { opacity: .55; cursor: default; }
  .link-quiet {
    background: none;
    border: 0;
    padding: 10px 4px;
    min-height: 44px;
    color: var(--ink-soft);
    font: 400 13px var(--font-body);
    text-decoration: underline;
    cursor: pointer;
  }

  /* 빨간 펜: 선생님 표시 전용 */
  .red-pen { font-family: var(--font-pen); font-weight: 400; color: var(--red-pen); font-size: 24px; line-height: 1.1; }
  .red-circle {
    display: inline-block;
    padding: 2px 14px;
    border: 2.4px solid var(--red-pen);
    border-radius: 50%;
    transform: rotate(-6deg);
  }
  .mark-cells { display: inline-flex; gap: 4px; align-items: center; }
  .mark-cell {
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid var(--ink);
    border-radius: 0;
    background: var(--paper-lift);
    color: var(--red-pen);
    font: 400 24px/1 var(--font-pen);
    cursor: pointer;
  }
  .mark-cell[aria-pressed="true"] { background: var(--red-pen); border-color: var(--red-pen); color: var(--paper); }
  .score-input {
    width: 48px;
    height: 36px;
    border: 1px solid var(--ink);
    border-radius: 0;
    background: var(--paper-lift);
    color: var(--red-pen);
    font: 400 22px var(--font-pen);
    text-align: center;
  }

  /* 안내 */
  .inline-note { border: 1.5px dashed var(--ink); padding: 10px; text-align: center; font-size: 13px; margin-top: 14px; }
  .inline-error { margin-top: 6px; padding-left: 8px; border-left: 3px solid var(--ink); font-size: 13px; font-weight: 700; }
  .dim { opacity: .55; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* 파일철 탭 */
  .index-tabs { display: flex; gap: 2px; flex-wrap: wrap; }
  .index-tab {
    min-height: 40px;
    padding: 8px 18px 7px;
    border: 1px solid var(--ink);
    border-bottom: 0;
    border-radius: 2px 2px 0 0;
    background: var(--paper-dim);
    color: var(--ink);
    font: 700 13px var(--font-body);
    cursor: pointer;
  }
  .index-tab[aria-selected="true"] { background: var(--paper); position: relative; top: 1px; }

  /* 잉크 스위치: label > input[checkbox] + .ink-switch__track + 글자 */
  .ink-switch { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
  .ink-switch input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .ink-switch__track {
    position: relative;
    flex: none;
    width: 38px;
    height: 20px;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    background: var(--paper);
    transition: background-color .12s;
  }
  .ink-switch__track::after {
    content: "";
    position: absolute;
    left: 2px;
    top: 2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--ink);
    transition: transform .12s, background-color .12s;
  }
  .ink-switch input:checked + .ink-switch__track { background: var(--ink); }
  .ink-switch input:checked + .ink-switch__track::after { background: var(--paper); transform: translateX(18px); }
  .ink-switch input:focus-visible + .ink-switch__track { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* 만점 도장 */
  .stamp { width: 112px; height: 112px; transform: rotate(-10deg); }
  .stamp--hit { animation: stamp-hit .3s ease-out; }
  @keyframes stamp-hit {
    from { transform: rotate(-10deg) scale(1.35); opacity: .3; }
    to { transform: rotate(-10deg) scale(1); opacity: 1; }
  }

  /* 키보드 포커스 링 */
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  /* 알림 줄 */
  #toast, .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    max-width: calc(100vw - 32px);
    padding: 10px 18px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 2px;
    font-size: 15px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
    z-index: 100;
  }
  #toast.show, .toast.show { opacity: 1; }
  #toast.error, .toast.error { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); }

  /* 학생 답안지 */
  .student-top { max-width: 760px; margin: 0 auto; text-align: right; }
  .info-table th { width: 56px; }
  .info-table td { padding: 2px 8px; }
  .info-input { width: 100%; min-width: 0; text-align: center; border-bottom: 0; }
  .answer-table { margin-top: 10px; }
  .answer-table td.num { vertical-align: top; padding-top: 14px; }
  .answer-table td.mark { font-size: 12px; }
  .blank-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; }
  .blank-label { font-size: 12px; font-weight: 700; min-width: 24px; }
  .line-input.other-num { width: 72px; min-width: 0; text-align: center; font-size: 16px; }
  .answer-cell .line-input.text-answer { flex: 1 1 0; width: auto; min-width: 80px; }
  .answer-read { padding: 6px 2px; overflow-wrap: anywhere; }
  .blank-row .answer-read { flex: 1 1 0; min-width: 0; }
  .bubble:disabled { cursor: default; }

  /* 채점 결과 */
  .result-total { position: absolute; top: 14px; right: 20px; }
  .result-total .red-circle { font-size: 30px; min-width: 56px; text-align: center; }
  .paper--result .paper-title { padding: 0 64px; }
  .answer-table td.mark .grade-glyph { font-size: 28px; }
  .answer-table td.mark .grade-score { font-size: 19px; }
  .correct-note { font-size: 22px; padding-left: 2px; overflow-wrap: anywhere; }
  .correct-value { font-family: var(--font-body); font-size: 15px; font-weight: 700; }
  .result-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .result-comment { margin: 0; font-size: 22px; overflow-wrap: anywhere; }
  .stamp { flex: none; color: var(--red-pen); }
  .poll-time { margin: 6px 0 0; text-align: center; font-size: 12px; color: var(--ink-soft); }
  .submit-row { text-align: center; margin-top: 16px; }
  #emptyCheck .btn-ink, #emptyCheck .btn-quiet { margin: 8px 4px 0; }

  /* 선생님 화면: 책상 위 상단 줄 + 파일철 탭 + 종이 */
  .teacher-view { max-width: 1180px; margin: 0 auto; }
  .t-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 10px; }
  .t-title { font-size: 20px; line-height: 1.3; overflow-wrap: anywhere; }
  .t-counts { margin: 0; font-size: 13px; font-weight: 700; }
  .t-pub {
    margin-left: auto;
    padding: 0 12px;
    background: var(--paper);
    border: 1px solid var(--ink);
    font-size: 13px;
  }
  .t-pub__name { order: -1; font-weight: 700; }
  .t-pub__state { min-width: 2.2em; font-size: 12px; }
  .t-top .btn-quiet { min-height: 44px; padding: 8px 16px; font-size: 13px; background: var(--paper); }
  .t-paper { border: 1px solid var(--ink); min-height: 240px; }
  .t-placeholder { margin: 0; color: var(--ink-soft); }

  /* 채점 탭 */
  .grade-views { display: flex; flex-wrap: wrap; gap: 0 18px; margin: 0 0 12px; }
  .grade-view-btn {
    min-height: 44px;
    padding: 8px 2px 6px;
    border: 0;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    background: none;
    color: var(--ink);
    font: 400 13px var(--font-body);
    cursor: pointer;
  }
  .grade-view-btn[aria-pressed="true"] { font-weight: 800; border-bottom-color: var(--ink); }
  .q-picker { display: flex; flex-wrap: wrap; padding: 0 1px 1px 0; margin-bottom: 14px; }
  .q-pick {
    position: relative;
    min-width: 44px;
    height: 44px;
    margin: 0 -1px -1px 0;
    padding: 0 10px;
    border: 1px solid var(--ink);
    border-radius: 0;
    background: var(--paper-shade);
    color: var(--ink);
    font: 800 14px var(--font-body);
    cursor: pointer;
  }
  .q-pick[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .q-pick--pending::after {
    content: "";
    position: absolute;
    top: 5px;
    right: 5px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .q-pick:focus-visible { z-index: 1; }
  .grade-qbar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
  .grade-qhead { flex: 1 1 320px; min-width: 0; font-size: 12px; overflow-wrap: anywhere; }
  .grade-qtitle { display: inline; font-size: 16px; }
  .grade-auto { display: inline-block; margin-left: 8px; padding: 0 5px; border: 1px solid var(--ink); font-size: 11px; white-space: nowrap; }
  .grade-remain { margin-left: auto; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .grade-after-note { margin: 0 0 10px; }
  .grade-table td.who { width: 120px; font-weight: 700; overflow-wrap: anywhere; }
  .grade-table td.answer, #gradeSheet td.answer, #gradeSheet td.correct { overflow-wrap: anywhere; }
  .sheet-table th.mark-col, .sheet-table td.mark-td { width: 196px; }
  .sheet-table td.mark-td { white-space: nowrap; }
  .grade-cell .score-error { white-space: normal; margin-top: 4px; }
  .answer-empty { color: var(--ink-soft); }
  tr.is-pending td { background: var(--paper-lift); }
  .score-input { -moz-appearance: textfield; appearance: textfield; padding: 0 2px; }
  .score-input::-webkit-inner-spin-button, .score-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .score-input::placeholder { color: var(--ink-soft); font: 400 12px var(--font-body); }

  .grade-split { display: grid; grid-template-columns: minmax(170px, 210px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .roster-table th { white-space: nowrap; }
  .roster-table td { font-size: 12px; padding: 0 7px; }
  .roster-table td.num { width: 36px; }
  .roster-table td.score { width: 52px; text-align: center; }
  .roster-table tr.is-selected td { background: var(--paper-lift); }
  .roster-pick {
    display: block;
    width: 100%;
    min-height: 36px;
    padding: 4px 0;
    border: 0;
    background: none;
    color: var(--ink);
    font: 400 12px var(--font-body);
    text-align: left;
    overflow-wrap: anywhere;
    cursor: pointer;
  }
  .roster-pick[aria-pressed="true"] { font-weight: 800; }
  .wait-tag { padding: 0 4px; border: 1px solid var(--ink); font-size: 11px; white-space: nowrap; }
  .grade-student { min-width: 0; }
  .grade-student-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .grade-student-head h2 { font-size: 16px; overflow-wrap: anywhere; }
  .grade-student-total { font-size: 28px; white-space: nowrap; }
  #gradeSheet th.num-col { width: 40px; }
  #gradeSheet th.correct-col { width: 120px; }
  #gradeSheet td.correct.criteria { font-size: 11px; }
  .comment-input {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 4px 2px;
    border: 0;
    border-bottom: 1px solid var(--red-pen);
    border-radius: 0;
    background: transparent;
    color: var(--red-pen);
    font: 400 22px var(--font-pen);
  }
  .comment-input::placeholder { color: var(--ink-soft); }
  .finish-area { margin-top: 12px; }
  .finish-buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .finish-warn { margin: 0 0 10px; text-align: left; }

  /* 결과 보기, 정답과 설정 탭 */
  .panel-h { font-size: 16px; margin: 0 0 8px; }
  .panel-h:not(:first-child) { margin-top: 26px; }
  .nowrap { white-space: nowrap; }
  .stat-table td, .roster-all td { font-size: 13px; }
  .roster-all td:last-child { min-width: 320px; }
  .ink-track { display: inline-block; width: 140px; max-width: 45%; height: 10px; vertical-align: middle; margin-right: 8px; }
  .ink-bar { display: block; height: 10px; background: var(--ink); }
  .bar-text { vertical-align: middle; white-space: nowrap; }
  .clear-area { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--ink); }
  .clear-ask { margin: 0 0 8px; font-weight: 700; }
  .clear-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .rule-line { margin: 0 0 2px; font-size: 13px; color: var(--ink-soft); }
  .setup-fields { margin: 0; padding: 0; border: 0; min-width: 0; }
  .setup-fields:disabled { opacity: .6; }
  .setup-table { margin-top: 10px; }
  .setup-table th, .setup-table td { white-space: nowrap; }
  .setup-table td.blank-count { text-align: center; font-size: 12px; }
  .setup-table td.center { text-align: center; }
  .setup-table td:nth-child(4) { min-width: 200px; white-space: normal; }
  .setup-answer { width: 100%; min-width: 0; font-size: 14px; }
  .setup-points { width: 64px; min-width: 0; text-align: center; font-size: 14px; }
  .setup-select {
    min-height: 36px;
    padding: 4px 6px;
    border: 1px solid var(--ink);
    border-radius: 0;
    background: var(--paper-lift);
    color: var(--ink);
    font: 400 14px var(--font-body);
  }
  .setup-check { width: 22px; height: 22px; margin: 0; accent-color: var(--ink); cursor: pointer; }
  .setup-table .link-quiet { min-height: 36px; padding: 4px 6px; }
  .setup-add { margin: 12px 0 0; }
  .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 24px; margin-bottom: 8px; }
  .setup-field .line-input { width: 100%; }
  .setup-switches { display: flex; flex-wrap: wrap; gap: 0 28px; }
  .setup-dirty { margin: 14px 0 0; font-size: 13px; font-weight: 700; }
  .setup-save { margin: 12px 0 0; }

  /* 비밀번호 쪽지 */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(31, 31, 29, .45);
  }
  .paper-note {
    width: 100%;
    max-width: 340px;
    padding: 20px 20px 16px;
    background-color: var(--paper);
    background-image: radial-gradient(rgba(80, 70, 40, .06) 1px, transparent 1px);
    background-size: 3px 3px;
    border: 1px solid var(--ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  }
  .paper-note h2 { font-size: 18px; margin-bottom: 14px; }
  .pw-label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .pw-input { width: 100%; min-width: 0; background: var(--paper-lift); padding: 8px 6px; }
  .pw-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .pw-actions .btn-ink, .pw-actions .btn-quiet { padding: 8px 18px; }

  /* 선생님 2단 -> 1단 */
  @media (max-width: 900px) {
    .paper--wide { padding: 16px; }
    /* 학생별 보기: 명렬표가 위로 올라가고 길면 그 안에서 스크롤 */
    .grade-split { grid-template-columns: minmax(0, 1fr); }
    .grade-roster-wrap { max-height: 232px; overflow-y: auto; }
  }
  @media (max-width: 520px) {
    body { padding: 10px 8px 40px; }
    .paper { padding: 14px 12px 18px; }
    .sheet-table th, .sheet-table td { padding: 4px 5px; }
    .bubble-group { gap: 0; }
    .line-input { min-width: 0; width: 100%; }
    .answer-table th { white-space: nowrap; padding-left: 2px; padding-right: 2px; }
    .answer-table td.num { width: 34px; padding-left: 2px; padding-right: 2px; }
    .answer-table td.mark { width: 36px; padding-left: 2px; padding-right: 2px; }
    .answer-table td.answer-cell { padding-left: 2px; padding-right: 2px; }
    .blank-row { gap: 0 4px; }
    .paper--result .paper-title { padding: 0 58px; font-size: 20px; }
    .result-total { right: 12px; }
    .result-total .red-circle { font-size: 26px; min-width: 48px; padding: 0 10px; }
    .correct-note { font-size: 20px; }
    .line-input.other-num { width: 56px; height: 36px; padding: 0 2px; border: 1px solid var(--ink); margin: 4px 0; font-size: 16px; }
    .line-input.other-num::placeholder { font-size: 12px; color: var(--ink-soft); }
    .answer-table .blank-row { gap: 0; }
    .answer-table .blank-label { margin-right: 4px; }
    /* 채점 칸은 2x2로 접어 답 칸 자리를 남긴다 */
    .sheet-table th.mark-col, .sheet-table td.mark-td { width: 86px; }
    .sheet-table td.mark-td { white-space: normal; }
    .grade-cell .mark-cells { flex-wrap: wrap; width: 76px; }
    .grade-cell .score-input { width: 36px; }
    .grade-table td.who { width: 72px; }
    #gradeSheet th.num-col { width: 30px; }
    #gradeSheet th.correct-col { width: 76px; }
