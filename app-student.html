<script>
  // ===== 학생 화면: 답안지 쓰기 =====

  var studentQuestions = [];   // [{qNum, qType, blankCount, points}]
  var studentAnswers = {};     // {qNum: [칸1, 칸2, ...]}
  var studentExamTitle = '';
  var savedSubmission = null;  // 제출 직후 {studentNumber, studentName, answers, examTitle, submittedAt}
  var isSubmitting = false;
  var studentPhase = 'writing'; // 'writing' | 'waiting' | 'result'

  // ===== 제출 기록 저장 / 복귀 (같은 기기·같은 브라우저, 모든 접근은 try/catch) =====
  var SAVED_KEY = 'omr.pendingSubmission.v1';
  var SAVED_TTL_MS = 12 * 60 * 60 * 1000;

  function saveSubmission(s) {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function clearSavedSubmission() {
    try { localStorage.removeItem(SAVED_KEY); } catch (e) {}
  }
  // 없음·제목 다름·12시간 초과·깨진 값이면 null (초과·불일치·깨짐은 지운다)
  function readSavedSubmission(examTitle, now) {
    try {
      var raw = localStorage.getItem(SAVED_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      var ok = s && typeof s === 'object' && s.examTitle === examTitle && typeof s.submittedAt === 'number' &&
        now - s.submittedAt <= SAVED_TTL_MS && s.studentNumber && s.studentName && s.answers && typeof s.answers === 'object';
      if (!ok) { clearSavedSubmission(); return null; }
      return s;
    } catch (e) {
      clearSavedSubmission(); // 깨진 값
      return null;
    }
  }

  // 새로고침 뒤 저장값이 있으면 답안지 대신 기다리는 화면으로 복귀
  function tryRestoreSubmission() {
    var s = readSavedSubmission(studentExamTitle, Date.now());
    if (!s) return false;
    savedSubmission = s;
    sById('answerForm').hidden = true;
    showWaiting(s);
    return true;
  }

  function blankCountOf(q) {
    return Math.max(1, Number(q.blankCount) || 1);
  }

  function sById(id) { return document.getElementById(id); }

  // 답안지 표 HTML. readOnly 면 버블·입력 대신 적힌 답만 보여준다
  function renderAnswerSheet(questions, opts) {
    opts = opts || {};
    var readOnly = !!opts.readOnly;
    var answers = opts.answers || {};
    var grades = opts.grades || null; // 결과 화면: {qNum: detail}
    var html = '<table class="sheet-table answer-table"><thead><tr><th>번호</th><th>답</th><th>' + escapeHtml(opts.thirdHeader || '배점') + '</th></tr></thead><tbody>';
    questions.forEach(function (q) {
      var n = blankCountOf(q);
      var given = answers[q.qNum] || [];
      html += '<tr data-row="' + Number(q.qNum) + '"><td class="num">' + Number(q.qNum) + '</td><td class="answer-cell">';
      for (var b = 0; b < n; b++) {
        var val = given[b] === undefined || given[b] === null ? '' : String(given[b]);
        var label = n > 1 ? '<span class="blank-label">(' + (b + 1) + ')</span>' : '';
        html += '<div class="blank-row">' + label;
        if (isChoiceType(q.qType)) {
          var opts2 = getBubbleOptionsForType(q.qType);
          html += '<span class="bubble-group" role="group" aria-label="' + Number(q.qNum) + '번' + (n > 1 ? ' (' + (b + 1) + ')' : '') + '">';
          opts2.forEach(function (o) {
            html += '<button type="button" class="bubble" data-q="' + Number(q.qNum) + '" data-b="' + b + '" data-v="' + escapeHtml(o) + '" aria-pressed="' + (val === o) + '"' + (readOnly ? ' disabled' : '') + '>' + escapeHtml(o) + '</button>';
          });
          html += '</span>';
          if (q.qType === '객관식') {
            if (readOnly) {
              if (val && opts2.indexOf(val) < 0) html += '<span class="answer-read">' + escapeHtml(val) + '</span>';
            } else {
              html += '<input type="text" class="line-input other-num" data-q="' + Number(q.qNum) + '" data-b="' + b + '" data-kind="other" placeholder="기타" inputmode="numeric" autocomplete="off" aria-label="' + Number(q.qNum) + '번 다른 번호' + (n > 1 ? ' (' + (b + 1) + ')' : '') + '" value="' + escapeHtml(val) + '">';
            }
          }
        } else if (q.qType === '서술형') {
          if (readOnly) html += '<div class="answer-read">' + escapeHtml(val) + '</div>';
          else html += '<textarea class="essay-input" data-q="' + Number(q.qNum) + '" data-b="0" data-kind="text" aria-label="' + Number(q.qNum) + '번 서술형 답">' + escapeHtml(val) + '</textarea>';
        } else {
          if (readOnly) html += '<div class="answer-read">' + escapeHtml(val) + '</div>';
          else html += '<input type="text" class="line-input text-answer" data-q="' + Number(q.qNum) + '" data-b="' + b + '" data-kind="text" autocomplete="off" aria-label="' + Number(q.qNum) + '번' + (n > 1 ? ' (' + (b + 1) + ')' : '') + ' 답" value="' + escapeHtml(val) + '">';
        }
        html += '</div>';
      }
      var g = grades ? grades[q.qNum] : null;
      if (g && opts.showCorrect && (g.status === 'X' || g.status === '△') && g.correctAnswer) {
        html += '<div class="red-pen correct-note">→ <span class="correct-value">' + escapeHtml(g.correctAnswer) + '</span></div>';
      }
      html += '</td><td class="mark">' + (opts.thirdHeader ? gradeMarkHtml(g) : escapeHtml(q.points)) + '</td></tr>';
    });
    return html + '</tbody></table>';
  }

  // 채점 표시 글자: O -> ○, X -> 빗금, △ -> △, 그 밖(보류 등)은 없음
  function markGlyph(status) {
    if (status === 'O') return '○';
    if (status === 'X') return '/';
    if (status === '△') return '△';
    return '';
  }
  function gradeMarkHtml(g) {
    if (!g) return '';
    var glyph = markGlyph(g.status);
    if (!glyph) return '';
    var html = '<span class="red-pen grade-glyph">' + glyph + '</span>';
    if (g.status === '△') html += '<br><span class="red-pen grade-score">' + escapeHtml(Number(g.earnedPoints) || 0) + '</span>';
    return html;
  }

  // 빈 칸이 하나라도 있는 문항 번호 목록
  function findEmptyQuestions(questions, answers) {
    var out = [];
    questions.forEach(function (q) {
      var arr = (answers && answers[q.qNum]) || [];
      var empty = false;
      for (var b = 0; b < blankCountOf(q); b++) {
        if (String(arr[b] === undefined || arr[b] === null ? '' : arr[b]).trim() === '') empty = true;
      }
      if (empty) out.push(q.qNum);
    });
    return out;
  }

  function showStudentStatus(text) {
    var el = sById('studentStatus');
    el.textContent = text;
    el.hidden = !text;
  }

  function showSubmitError(text) {
    var el = sById('submitError');
    el.textContent = text || '';
    el.hidden = !text;
  }

  // 화면을 처음 상태로 되돌리고 문항을 불러온다
  async function loadStudentScreen() {
    stopWaitingPoll();
    studentPhase = 'writing';
    sById('studentPaper').classList.remove('paper--result');
    sById('resultTotal').hidden = true;
    sById('resultTotal').innerHTML = '';
    sById('studentNumber').readOnly = false;
    sById('studentName').readOnly = false;
    sById('answerForm').hidden = true;
    sById('emptyCheck').hidden = true;
    sById('studentAfter').innerHTML = '';
    showSubmitError('');
    showStudentStatus('답안지를 불러오는 중…');
    isSubmitting = false;
    var btn = sById('submitBtn');
    btn.disabled = false;
    btn.textContent = '답안지 내기';
    try {
      var data = await serverCall('getStudentInitData');
      studentExamTitle = data.examTitle || '우리들의 답안지';
      sById('examTitle').textContent = studentExamTitle;
      document.title = studentExamTitle;
      studentQuestions = data.questions || [];
      studentAnswers = {};
      studentQuestions.forEach(function (q) {
        studentAnswers[q.qNum] = new Array(blankCountOf(q)).fill('');
      });
      if (studentQuestions.length === 0) {
        sById('answerTable').innerHTML = '';
        showStudentStatus('등록된 문항이 없어요.');
        return;
      }
      sById('answerTable').innerHTML = renderAnswerSheet(studentQuestions);
      showStudentStatus('');
      sById('answerForm').hidden = false;
      tryRestoreSubmission();
    } catch (e) {
      showStudentStatus('답안지를 불러오지 못했어요. 새로고침해 주세요.');
    }
  }

  // 한 칸의 값을 바꾸고 화면(버블 눌림, 다른 번호 입력)을 맞춘다
  function setBlankValue(qNum, b, val, source) {
    var row = document.querySelector('#answerTable tr[data-row="' + qNum + '"]');
    if (!row) return;
    studentAnswers[qNum][b] = val;
    var bubbles = row.querySelectorAll('.bubble[data-b="' + b + '"]');
    Array.prototype.forEach.call(bubbles, function (el) {
      el.setAttribute('aria-pressed', el.getAttribute('data-v') === val ? 'true' : 'false');
    });
    if (source !== 'input') {
      var other = row.querySelector('input[data-kind="other"][data-b="' + b + '"]');
      if (other) other.value = val;
    }
    sById('emptyCheck').hidden = true;
  }

  function onAnswerClick(ev) {
    var btn = ev.target.closest ? ev.target.closest('.bubble') : null;
    if (!btn || btn.disabled) return;
    var qNum = Number(btn.getAttribute('data-q'));
    var b = Number(btn.getAttribute('data-b'));
    var v = btn.getAttribute('data-v');
    // 같은 칸을 다시 누르면 해제
    setBlankValue(qNum, b, studentAnswers[qNum][b] === v ? '' : v, 'bubble');
  }

  function onAnswerInput(ev) {
    var el = ev.target;
    if (!el.getAttribute || !el.getAttribute('data-kind')) return;
    var qNum = Number(el.getAttribute('data-q'));
    var b = Number(el.getAttribute('data-b'));
    if (el.getAttribute('data-kind') === 'other') {
      // 보기에 있는 번호면 버블도 맞추고, 아니면 버블만 비운 채 입력값을 답으로 둔다
      setBlankValue(qNum, b, el.value.trim(), 'input');
    } else {
      studentAnswers[qNum][b] = el.value;
      sById('emptyCheck').hidden = true;
    }
  }

  function showEmptyCheck(list) {
    var box = sById('emptyCheck');
    box.innerHTML = '<div>아직 안 쓴 문항이 있어요: ' + list.map(function (n) { return Number(n) + '번'; }).join(', ') + '</div>' +
      '<button type="button" class="btn-ink" data-action="submit-anyway">그래도 내기</button>' +
      '<button type="button" class="btn-quiet" data-action="review">다시 보기</button>';
    box.hidden = false;
  }

  function focusFirstEmpty() {
    var list = findEmptyQuestions(studentQuestions, studentAnswers);
    if (list.length === 0) return;
    var target = document.querySelector('#answerTable tr[data-row="' + list[0] + '"] [data-q]');
    if (target) target.focus();
  }

  function onEmptyCheckClick(ev) {
    var btn = ev.target.closest ? ev.target.closest('button[data-action]') : null;
    if (!btn) return;
    if (btn.getAttribute('data-action') === 'review') {
      sById('emptyCheck').hidden = true;
      focusFirstEmpty();
    } else {
      submitAnswers({ skipEmptyCheck: true });
    }
  }

  // 답안지 내기. 번호·이름 확인, 빈 문항 확인(건너뛰기 가능) 뒤 서버로 보낸다
  async function submitAnswers(opts) {
    if (isSubmitting) return;
    var skip = !!(opts && opts.skipEmptyCheck);
    var numEl = sById('studentNumber');
    var nameEl = sById('studentName');
    var number = numEl.value.trim();
    var name = nameEl.value.trim();
    showSubmitError('');
    if (!number || !name) {
      sById('emptyCheck').hidden = true;
      showSubmitError('번호와 이름을 써주세요.');
      (!number ? numEl : nameEl).focus();
      return;
    }
    if (!skip) {
      var empties = findEmptyQuestions(studentQuestions, studentAnswers);
      if (empties.length > 0) {
        showEmptyCheck(empties);
        return;
      }
    }
    sById('emptyCheck').hidden = true;

    var answers = {};
    studentQuestions.forEach(function (q) {
      answers[q.qNum] = studentAnswers[q.qNum].slice();
    });
    var btn = sById('submitBtn');
    isSubmitting = true;
    btn.disabled = true;
    btn.textContent = '내는 중…';
    try {
      var res = await serverCall('submitStudentAnswers', { studentNumber: number, studentName: name, answers: answers });
      if (!res || !res.success) {
        showSubmitError((res && res.message) || '답안지를 내지 못했어요. 다시 눌러 주세요.');
        return;
      }
      savedSubmission = {
        studentNumber: number,
        studentName: name,
        answers: answers,
        examTitle: studentExamTitle,
        submittedAt: Date.now()
      };
      saveSubmission(savedSubmission);
      sById('answerForm').hidden = true;
      showWaiting(savedSubmission);
    } catch (e) {
      showSubmitError('답안지를 내지 못했어요. 다시 눌러 주세요.');
    } finally {
      isSubmitting = false;
      btn.disabled = false;
      btn.textContent = '답안지 내기';
    }
  }

  // ===== ② 기다리는 화면 + 자동 확인 =====
  // 5초에서 시작해 x1.5 씩 늘려 최대 30초, 요청마다 0~1초 무작위 지연
  var POLL_MIN_MS = 5000;
  var POLL_MAX_MS = 30000;
  var pollDelay = POLL_MIN_MS;
  var pollTimer = null;
  var pollToken = 0;

  function stopWaitingPoll() {
    clearTimeout(pollTimer);
    pollTimer = null;
    pollToken++; // 아직 오지 않은 응답은 버린다
  }

  function startWaitingPoll() {
    stopWaitingPoll();
    pollDelay = POLL_MIN_MS;
    checkNow();
  }

  // 선생님 화면에 갔다 돌아왔을 때 기다리는 중이면 다시 확인 시작
  function resumeWaitingPoll() {
    if (studentPhase === 'waiting' && pollTimer === null && savedSubmission) startWaitingPoll();
  }

  function scheduleNextPoll() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(checkNow, pollDelay + Math.floor(Math.random() * 1000));
    pollDelay = Math.min(Math.round(pollDelay * 1.5), POLL_MAX_MS);
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  async function checkNow() {
    if (studentPhase !== 'waiting' || !savedSubmission) return;
    var token = pollToken;
    var res = null;
    try {
      res = await serverCall('checkStudentResultStatus', {
        studentNumber: savedSubmission.studentNumber,
        studentName: savedSubmission.studentName
      });
    } catch (e) {
      res = null;
    }
    if (token !== pollToken || sById('studentView').hidden) return;
    if (res) {
      var d = new Date();
      var t = sById('pollTime');
      if (t) t.textContent = '마지막 확인 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }
    if (res && res.published) {
      stopWaitingPoll();
      renderResult(res);
    } else {
      scheduleNextPoll();
    }
  }

  function showWaiting(saved) {
    savedSubmission = saved;
    studentPhase = 'waiting';
    sById('studentNumber').value = saved.studentNumber;
    sById('studentName').value = saved.studentName;
    sById('studentNumber').readOnly = true;
    sById('studentName').readOnly = true;
    sById('studentAfter').innerHTML =
      '<div class="table-wrap dim">' + renderAnswerSheet(studentQuestions, { readOnly: true, answers: saved.answers, thirdHeader: '채점' }) + '</div>' +
      '<div id="waitingNote" class="inline-note" role="status" tabindex="-1"><b>답안지를 냈어요.</b><br>선생님이 채점하시면 이 화면에 바로 나와요.</div>' +
      '<p id="pollTime" class="poll-time"></p>' +
      '<div class="submit-row"><button type="button" id="newStudentLink" class="link-quiet" data-action="new-student">다른 학생이 새로 쓰기</button></div>';
    sById('waitingNote').focus();
    startWaitingPoll();
  }

  // 저장값을 지우고 빈 답안지로 돌아간다
  async function startNewSheet() {
    clearSavedSubmission();
    savedSubmission = null;
    sById('studentNumber').value = '';
    sById('studentName').value = '';
    await loadStudentScreen();
    sById('studentNumber').focus();
  }

  // ===== ③ 채점 결과 =====
  // 칸별 답: 이 기기에 저장한 답을 먼저, 없으면 서버가 돌려준 문자열을 쉼표로 나눈다
  function answersForResult(d, n) {
    var saved = savedSubmission && savedSubmission.answers ? savedSubmission.answers[d.qNum] : null;
    if (Array.isArray(saved)) return saved;
    var text = String(d.userAnswer === null || d.userAnswer === undefined ? '' : d.userAnswer);
    if (n <= 1) return [text];
    var parts = text.split(',').map(function (x) { return x.trim(); });
    if (parts.length > n) parts = parts.slice(0, n - 1).concat([parts.slice(n - 1).join(', ')]);
    return parts;
  }

  function renderResult(res) {
    stopWaitingPoll();
    studentPhase = 'result';
    var details = res.details || [];
    var questions = [];
    var answers = {};
    var grades = {};
    details.forEach(function (d) {
      var known = studentQuestions.filter(function (q) { return Number(q.qNum) === Number(d.qNum); })[0];
      var q = { qNum: d.qNum, qType: d.qType, blankCount: known ? known.blankCount : 1, points: d.maxPoints };
      questions.push(q);
      answers[d.qNum] = answersForResult(d, d.qType === '서술형' ? 1 : blankCountOf(q));
      grades[d.qNum] = d;
    });
    var showScore = !!res.showScore;
    var html = '<div class="table-wrap">' + renderAnswerSheet(questions, {
      readOnly: true,
      answers: answers,
      grades: showScore ? grades : null,
      thirdHeader: showScore ? '채점' : '',
      showCorrect: showScore && !!res.showCorrectAnswers
    }) + '</div>';
    if (!showScore) html += '<div class="inline-note">선생님이 채점을 마쳤어요.</div>';
    var comment = String(res.teacherComment || '').trim();
    var stamp = showScore && res.isPerfectScore;
    if (comment || stamp) {
      html += '<div class="result-foot">' + (comment ? '<p class="red-pen result-comment">' + escapeHtml(comment) + '</p>' : '<span></span>');
      if (stamp) {
        html += '<svg class="stamp stamp--hit" viewBox="0 0 120 120" role="img" aria-label="참 잘했어요 도장">' +
          '<g fill="none" stroke="currentColor"><circle cx="60" cy="60" r="52" stroke-width="4"/><circle cx="60" cy="60" r="44" stroke-width="1.5"/></g>' +
          '<g font-family="Gowun Batang, serif" font-weight="700" fill="currentColor" text-anchor="middle"><text x="60" y="56" font-size="22">참 잘</text><text x="60" y="82" font-size="22">했어요</text></g></svg>';
      }
      html += '</div>';
    }
    html += '<div class="submit-row"><button type="button" class="btn-quiet" data-action="go-start">처음으로</button></div>';
    sById('studentAfter').innerHTML = html;
    var total = sById('resultTotal');
    if (showScore) {
      var score = escapeHtml(Number(res.totalScore) || 0);
      total.innerHTML = '<span class="red-pen red-circle" role="img" aria-label="총점 ' + score + '점">' + score + '</span>';
      total.hidden = false;
    } else {
      total.hidden = true;
    }
    sById('studentPaper').classList.add('paper--result');
    showToast('채점 결과가 나왔어요.');
  }

  function onAfterClick(ev) {
    var btn = ev.target.closest ? ev.target.closest('button[data-action]') : null;
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    if (action === 'new-student' || action === 'go-start') startNewSheet();
  }

  // 이벤트 위임
  sById('studentAfter').addEventListener('click', onAfterClick);
  sById('answerTable').addEventListener('click', onAnswerClick);
  sById('answerTable').addEventListener('input', onAnswerInput);
  sById('emptyCheck').addEventListener('click', onEmptyCheckClick);
  sById('submitBtn').addEventListener('click', function () { submitAnswers(); });
  sById('teacherEntryBtn').addEventListener('click', function () {
    if (typeof openTeacherLogin === 'function') openTeacherLogin();
  });

  loadStudentScreen();
</script>
