<script>
  // ===== 선생님 화면: 로그인, 상단 줄, 탭 =====

  function newTeacherState() {
    return {
      pw: '', settings: {}, questions: [], submissions: [], stats: [],
      tab: 'grade', gradeView: 'byQuestion', selectedQNum: null, selectedRowIndex: null
    };
  }
  var teacherState = newTeacherState();
  // 로그인 성공 / 나가기마다 올라가는 번호: 늦게 온 응답이 지난 세션을 건드리지 못하게 한다
  var teacherSession = 0;
  // 로그인 확인 중 표시와, 쪽지를 열고 닫을 때마다 올라가는 번호
  var verifying = false;
  var loginSeq = 0;
  var publishing = false;
  // 정답과 설정을 저장했으면 학생 화면으로 돌아갈 때 쓰는 중인 답안지를 다시 불러온다
  var studentReloadNeeded = false;

  var TAB_IDS = { grade: 'tabGrade', results: 'tabResults', setup: 'tabSetup' };
  var PANEL_IDS = { grade: 'panelGrade', results: 'panelResults', setup: 'panelSetup' };
  var TAB_ORDER = ['grade', 'results', 'setup'];

  function tEl(id) { return document.getElementById(id); }

  // 채점 대기 = 완료 표시가 안 된 제출 수
  function countWaiting(submissions) {
    return (submissions || []).filter(function (s) { return !s.isCompleted; }).length;
  }

  // ----- 로그인 쪽지 -----
  function openTeacherLogin() {
    loginSeq++;
    tEl('teacherPwInput').value = '';
    tEl('pwError').hidden = true;
    tEl('pwError').textContent = '';
    tEl('pwOkBtn').disabled = false;
    tEl('passwordModal').hidden = false;
    tEl('teacherPwInput').focus();
  }

  function closeTeacherLogin() {
    loginSeq++;
    tEl('passwordModal').hidden = true;
    tEl('teacherPwInput').value = '';
    // 쪽지를 닫으면 포커스는 학생 화면의 "선생님" 버튼으로
    if (!tEl('studentView').hidden) tEl('teacherEntryBtn').focus();
  }

  function selectPwText() {
    var el = tEl('teacherPwInput');
    el.focus();
    el.select();
  }

  function showPwError(message) {
    var el = tEl('pwError');
    el.textContent = message;
    el.hidden = false;
  }

  async function confirmTeacherLogin() {
    var pw = tEl('teacherPwInput').value;
    if (verifying) return;
    if (!pw) { showPwError('비밀번호를 입력해 주세요.'); return; }
    var okBtn = tEl('pwOkBtn');
    var seq = loginSeq;
    verifying = true;
    okBtn.disabled = true;
    tEl('pwError').hidden = true;
    var res;
    try {
      res = await serverCall('verifyTeacherAndGetData', pw);
    } catch (e) {
      res = null;
    }
    verifying = false;
    okBtn.disabled = false;
    if (seq !== loginSeq) return; // 확인하는 사이 쪽지를 닫았다
    if (res === null) { showPwError('연결하지 못했어요. 잠시 뒤에 다시 눌러 주세요.'); selectPwText(); return; }
    if (!res || !res.success) { showPwError((res && res.message) || '확인하지 못했어요. 다시 시도해 주세요.'); selectPwText(); return; }
    teacherSession++;
    Object.assign(teacherState, newTeacherState());
    teacherState.pw = pw;
    applyTeacherData(res);
    closeTeacherLogin();
    setMode('teacher');
    renderTopBar();
    switchTab('grade');
    tEl('tabGrade').focus();
  }

  // 서버 응답을 상태에 넣는다 (화면은 건드리지 않음)
  function applyTeacherData(res) {
    teacherState.settings = res.settings || {};
    teacherState.questions = res.questions || [];
    teacherState.submissions = res.submissions || [];
    teacherState.stats = res.questionStats || [];
  }

  async function refreshTeacherData() {
    if (!teacherState.pw) return;
    var session = teacherSession;
    var res;
    try {
      res = await serverCall('verifyTeacherAndGetData', teacherState.pw);
    } catch (e) {
      if (session === teacherSession) showToast('새로고침하지 못했어요. 연결을 확인해 주세요.', 'error');
      return;
    }
    if (session !== teacherSession) return; // 그 사이 선생님 화면을 나갔다
    if (!res || !res.success) { showToast((res && res.message) || '새로고침하지 못했어요.', 'error'); return; }
    var x = window.scrollX, y = window.scrollY;
    applyTeacherData(res);
    renderTopBar();
    renderActivePanel();
    window.scrollTo(x, y);
  }

  function leaveTeacherMode() {
    teacherSession++;
    Object.assign(teacherState, newTeacherState());
    clearAsked = false;
    setupDraft = null;
    tEl('publishSwitch').checked = false;
    ['panelGrade', 'panelResults', 'panelSetup'].forEach(function (id) { tEl(id).innerHTML = ''; });
    setMode('student');
    if (studentReloadNeeded) {
      studentReloadNeeded = false;
      if (typeof loadStudentScreen === 'function' && studentPhase === 'writing') loadStudentScreen();
    }
  }

  // ----- 상단 줄 -----
  function renderTopBar() {
    var s = teacherState.settings || {};
    var subs = teacherState.submissions;
    tEl('tExamTitle').textContent = s.examTitle || '우리들의 답안지';
    tEl('tCounts').textContent = '제출 ' + subs.length + '명 · 채점 대기 ' + countWaiting(subs) + '명';
    var on = s.publishResults === true;
    tEl('publishSwitch').checked = on;
    tEl('publishState').textContent = on ? '켜짐' : '꺼짐';
  }

  async function togglePublish(checked) {
    var sw = tEl('publishSwitch');
    if (publishing) { renderTopBar(); return; } // 처리 중에 또 눌러도 서버에는 한 번만
    if (setupDraft && setupDraft.saving) { // 설정 저장이 공개 값을 덮지 않게 끝날 때까지 기다린다
      renderTopBar();
      showToast('설정 저장이 끝난 뒤에 다시 눌러주세요.', 'error');
      return;
    }
    publishing = true;
    sw.setAttribute('aria-busy', 'true'); // disabled 로 막으면 키보드 포커스를 잃는다
    var session = teacherSession;
    var res = null;
    try {
      res = await serverCall('setPublishResultsStatus', { authPassword: teacherState.pw, publish: checked, markAllCompleted: false });
    } catch (e) {
      res = { success: false, message: '연결하지 못했어요. 다시 눌러 주세요.' };
    }
    publishing = false;
    sw.removeAttribute('aria-busy');
    if (session !== teacherSession) return;
    if (res && res.success) {
      teacherState.settings.publishResults = checked;
      renderTopBar();
      showToast(checked ? '결과를 보여주기 시작했어요' : '결과를 다시 가렸어요');
    } else {
      renderTopBar(); // 스위치를 서버에 남아 있는 값으로 되돌린다
      showToast((res && res.message) || '바꾸지 못했어요. 다시 눌러 주세요.', 'error');
    }
  }

  // ----- 탭 -----
  function renderActivePanel() {
    var t = teacherState.tab;
    if (t === 'results') renderResultsPanel();
    else if (t === 'setup') renderSetupPanel();
    else renderGradePanel();
  }

  function switchTab(name) {
    if (!PANEL_IDS[name]) name = 'grade';
    teacherState.tab = name;
    TAB_ORDER.forEach(function (key) {
      var active = key === name;
      var tab = tEl(TAB_IDS[key]);
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
      tab.tabIndex = active ? 0 : -1;
      tEl(PANEL_IDS[key]).hidden = !active;
    });
    renderActivePanel();
  }

  function onTabKeydown(e) {
    var i = TAB_ORDER.indexOf(teacherState.tab);
    var next = -1;
    if (e.key === 'ArrowRight') next = (i + 1) % TAB_ORDER.length;
    else if (e.key === 'ArrowLeft') next = (i + TAB_ORDER.length - 1) % TAB_ORDER.length;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = TAB_ORDER.length - 1;
    if (next < 0) return;
    e.preventDefault();
    switchTab(TAB_ORDER[next]);
    tEl(TAB_IDS[TAB_ORDER[next]]).focus();
    refreshTeacherData();
  }

  // ----- 채점 탭 -----
  // 채점 칸 글자: ○ = 만점, △ = 부분 점수, / = 0점
  var MARK_ORDER = ['O', '△', 'X'];
  var MARK_GLYPH = { 'O': '○', '△': '△', 'X': '/' };
  var MARK_NAME = { 'O': '맞음', '△': '부분 점수', 'X': '틀림' };

  // 칸별 상태 'row|q' -> {seq, done, shown}: 마지막으로 누른 것(shown)이 저장될 때까지 그것을 보여준다
  var gradeCells = {};
  // 행별 저장 줄: 한 학생의 저장은 누른 차례대로 하나씩 보낸다 (서버에 늦게 닿은 옛 값이 새 값을 덮지 않게)
  var gradeRows = {};
  var commentDrafts = {};
  var gradeBookSession = -1;
  function gradeBook() {
    if (gradeBookSession !== teacherSession) {
      gradeCells = {}; gradeRows = {}; commentDrafts = {};
      gradeBookSession = teacherSession;
    }
  }
  function rowBook(rowIndex) {
    return gradeRows[rowIndex] || (gradeRows[rowIndex] = { chain: Promise.resolve(), finishing: false });
  }
  function runInRowQueue(rowIndex, job) {
    var r = rowBook(rowIndex);
    gradeInflight++;
    var p = r.chain.then(job);
    r.chain = p.catch(function () {});
    var done = function () { gradeInflight--; };
    p.then(done, done);
    return p;
  }
  // 채점 저장이 진행 중인 개수: 0이 아니면 기록 지우기와 설정 저장을 미룬다
  var gradeInflight = 0;
  var GRADE_BUSY_NOTE = '채점 저장이 끝난 뒤에 다시 눌러주세요.';
  var PUBLISH_BUSY_NOTE = '결과 공개 저장이 끝난 뒤에 다시 눌러주세요.';
  // 기록이 바뀐 뒤(지우기, 문항 저장): 행 번호와 문항 번호로 묶인 채점 기억을 비운다
  function resetGradeBook() {
    gradeCells = {}; gradeRows = {}; commentDrafts = {};
    teacherState.selectedRowIndex = null;
    teacherState.selectedQNum = null;
  }

  function findSub(rowIndex) {
    var n = Number(rowIndex);
    return teacherState.submissions.filter(function (s) { return Number(s.rowIndex) === n; })[0] || null;
  }
  function questionOf(qNum) {
    var n = Number(qNum);
    return teacherState.questions.filter(function (q) { return Number(q.qNum) === n; })[0] || null;
  }
  function fmtScore(v) { return String(Math.round((Number(v) || 0) * 10) / 10); }

  // 그 문항이 '보류'인 제출 수
  function countPendingForQuestion(submissions, qNum) {
    return (submissions || []).filter(function (s) {
      var rec = s.perQuestionMap && s.perQuestionMap[qNum];
      return !!rec && rec.status === '보류';
    }).length;
  }

  // 채점 순서: 보류가 남은 서술형 -> 다른 서술형 -> 나머지 (각각 번호순)
  function orderQuestionsForGrading(questions, submissions) {
    var groups = [[], [], []];
    (questions || []).forEach(function (q) {
      var g = q.qType !== '서술형' ? 2 : (countPendingForQuestion(submissions, q.qNum) > 0 ? 0 : 1);
      groups[g].push(Number(q.qNum));
    });
    var asc = function (a, b) { return a - b; };
    return groups[0].sort(asc).concat(groups[1].sort(asc), groups[2].sort(asc));
  }

  // 채점 칸 저장: 완료 상태는 그 행의 지금 값을 그대로 보낸다 (완료는 '채점 끝'에서만 바뀐다)
  function buildGradePayload(sub, qNum, status, earned, max) {
    var updated = {};
    updated[qNum] = { status: status, earnedPoints: earned, maxPoints: max };
    return {
      authPassword: teacherState.pw, rowIndex: sub.rowIndex, rowKey: sub.rowKey,
      updatedQuestions: updated, forceComplete: sub.isCompleted === true
    };
  }

  function parsePartialScore(input, max) {
    var raw = String(input === null || input === undefined ? '' : input).trim();
    var bad = { ok: false, message: '0에서 ' + max + '점 사이 숫자를 써주세요' };
    if (!/^(\d+(\.\d+)?|\.\d+)$/.test(raw)) return bad;
    var v = Number(raw);
    if (!isFinite(v) || v < 0 || v > max) return bad;
    return { ok: true, value: v };
  }
  function statusForScore(v, max) { return v >= max ? 'O' : (v <= 0 ? 'X' : '△'); }

  // 명렬표 순서: 번호(숫자) 오름차순, 같으면 이름순
  function rosterOrder(subs) {
    return (subs || []).slice().sort(function (a, b) {
      var na = parseFloat(a.studentNumber), nb = parseFloat(b.studentNumber);
      var fa = isFinite(na), fb = isFinite(nb);
      if (fa && fb && na !== nb) return na - nb;
      if (fa !== fb) return fa ? -1 : 1;
      if (!fa) {
        var c = String(a.studentNumber).localeCompare(String(b.studentNumber), 'ko');
        if (c) return c;
      }
      return String(a.studentName).localeCompare(String(b.studentName), 'ko');
    });
  }
  function neighborRow(rowIndex, step) {
    var list = rosterOrder(teacherState.submissions);
    for (var i = 0; i < list.length; i++) {
      if (Number(list[i].rowIndex) === Number(rowIndex)) return list[i + step] || null;
    }
    return null;
  }

  // 화면에 보일 채점 값: 저장 중이면 마지막으로 누른 값, 아니면 저장된 값
  function effectiveMark(rowIndex, qNum) {
    var c = gradeCells[rowIndex + '|' + qNum];
    if (c && !c.done) return c.shown;
    var sub = findSub(rowIndex);
    var rec = sub && sub.perQuestionMap ? sub.perQuestionMap[qNum] : null;
    return rec ? { status: rec.status, earned: Number(rec.earnedPoints) || 0 } : null;
  }
  // 서버에 저장된 값 기준 보류 문항
  function savedPendingQNums(sub) {
    var map = sub.perQuestionMap || {};
    return teacherState.questions.map(function (q) { return Number(q.qNum); }).sort(function (a, b) { return a - b; })
      .filter(function (n) { return !!map[n] && map[n].status === '보류'; });
  }
  // 화면을 불러온 뒤 다른 곳에서 기록이 바뀌었다
  function recordChangedElsewhere() {
    showToast('다른 곳에서 바뀐 기록이에요. 새로고침했어요.', 'error');
    refreshTeacherData();
  }
  function pendingQNums(sub) {
    return teacherState.questions.map(function (q) { return Number(q.qNum); }).sort(function (a, b) { return a - b; })
      .filter(function (n) { var m = effectiveMark(sub.rowIndex, n); return !!m && m.status === '보류'; });
  }

  function answerHtml(sub, q) {
    var a = sub.answersByQ ? sub.answersByQ[q.qNum] : '';
    var str = a === undefined || a === null ? '' : String(a);
    if (str.trim() === '' || str.trim() === '(미입력)') return '<span class="answer-empty">(빈칸)</span>';
    if (q.qType !== '서술형') str = str.split(',').map(function (x) { return x.trim(); }).join(', ');
    return escapeHtml(str);
  }

  function markCellHtml(sub, q) {
    var eff = effectiveMark(sub.rowIndex, q.qNum);
    var st = eff ? eff.status : '';
    var max = Number(q.points) || 0;
    var label = q.qNum + '번 ' + sub.studentName;
    var btn = function (m) {
      return '<button type="button" class="mark-cell" data-mark="' + m + '" aria-label="' + MARK_NAME[m] + '" aria-pressed="' + (st === m) + '">' + MARK_GLYPH[m] + '</button>';
    };
    return '<div class="grade-cell" data-row="' + Number(sub.rowIndex) + '" data-q="' + Number(q.qNum) + '">' +
      '<span class="mark-cells" role="group" aria-label="' + escapeHtml(label + ' 채점') + '">' +
      btn('O') + btn('△') +
      '<input type="text" class="score-input" inputmode="decimal" autocomplete="off" placeholder="점"' +
      ' aria-label="' + escapeHtml(label + ' 부분점수') + '" value="' + (st === '△' ? fmtScore(eff.earned) : '') + '">' +
      btn('X') + '</span>' +
      '<p class="inline-error score-error" role="alert" hidden></p></div>';
  }

  function viewSwitchHtml(byQ) {
    return '<div class="grade-views" role="group" aria-label="채점 보기">' +
      '<button type="button" class="grade-view-btn" id="gvByQuestion" data-gview="byQuestion" aria-pressed="' + byQ + '">문항별로 모아서</button>' +
      '<button type="button" class="grade-view-btn" id="gvByStudent" data-gview="byStudent" aria-pressed="' + !byQ + '">학생별로</button>' +
      '</div>';
  }

  function renderGradePanel() {
    gradeBook();
    var byQ = teacherState.gradeView !== 'byStudent';
    var html = viewSwitchHtml(byQ);
    if (!teacherState.questions.length) html += '<p class="t-placeholder">정답표에 문항이 없어요. 정답과 설정에서 문항을 넣어 주세요.</p>';
    else if (!teacherState.submissions.length) html += '<p class="t-placeholder">아직 낸 답안지가 없어요.</p>';
    else html += byQ ? questionViewHtml() : studentViewHtml();
    tEl('panelGrade').innerHTML = html;
  }

  // 화면 일부를 다시 그린 뒤 같은 단추로 포커스를 돌려놓는다
  function rerenderGradeKeepingFocus(selector) {
    var x = window.scrollX, y = window.scrollY;
    renderGradePanel();
    window.scrollTo(x, y);
    var el = selector ? tEl('panelGrade').querySelector(selector) : null;
    if (el) el.focus({ preventScroll: true });
  }

  // --- 문항별로 모아서 ---
  function pickInner(n, pending) {
    return String(n) + (pending ? '<span class="visually-hidden"> 남은 채점 있음</span>' : '');
  }
  function questionHeadInfo(qNum) {
    var pending = countPendingForQuestion(teacherState.submissions, qNum);
    return { pending: pending, showNote: pending === 0 && countWaiting(teacherState.submissions) > 0 };
  }

  function questionViewHtml() {
    var subs = teacherState.submissions;
    var order = orderQuestionsForGrading(teacherState.questions, subs);
    if (order.indexOf(Number(teacherState.selectedQNum)) < 0) teacherState.selectedQNum = order[0];
    var qNum = Number(teacherState.selectedQNum);
    var q = questionOf(qNum);
    var info = questionHeadInfo(qNum);
    var picker = '<div class="q-picker" id="qPicker" role="group" aria-label="문항 고르기">' + order.map(function (n) {
      var p = countPendingForQuestion(subs, n) > 0;
      return '<button type="button" class="q-pick' + (p ? ' q-pick--pending' : '') + '" data-qnum="' + n + '" aria-pressed="' + (n === qNum) + '">' + pickInner(n, p) + '</button>';
    }).join('') + '</div>';
    var head = '<div class="grade-qbar">' +
      '<div class="grade-qhead" id="gradeQHead">' +
      '<h2 class="grade-qtitle">' + qNum + '번 · ' + escapeHtml(q.qType) + ' · ' + fmtScore(q.points) + '점</h2>' +
      '<span class="grade-criteria"> · 채점 기준: ' + escapeHtml(q.rawAnswerStr) + '</span>' +
      (q.qType !== '서술형' ? '<span class="grade-auto">자동 채점 문항</span>' : '') +
      '</div>' +
      '<span class="grade-remain" id="gradeRemain">' + info.pending + '명 남음</span></div>' +
      '<p class="inline-note grade-after-note" id="gradeAfterNote"' + (info.showNote ? '' : ' hidden') + '>' +
      "학생별로에서 한 말씀을 쓰고 '채점 끝'을 누르면 학생에게 보여요.</p>";
    var rows = rosterOrder(subs).map(function (s) {
      var eff = effectiveMark(s.rowIndex, qNum);
      return '<tr data-row="' + Number(s.rowIndex) + '"' + (eff && eff.status === '보류' ? ' class="is-pending"' : '') + '>' +
        '<td class="who">' + escapeHtml(s.studentNumber) + ' ' + escapeHtml(s.studentName) + '</td>' +
        '<td class="answer">' + answerHtml(s, q) + '</td>' +
        '<td class="mark-td">' + markCellHtml(s, q) + '</td></tr>';
    }).join('');
    return picker + head +
      '<div class="table-wrap"><table class="sheet-table grade-table"><thead><tr>' +
      '<th class="who-col">학생</th><th>답</th><th class="mark-col">채점</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  // --- 학생별로 ---
  function scoreCellHtml(sub) {
    return sub.isCompleted ? fmtScore(sub.totalScore) : '<span class="wait-tag">대기</span>';
  }
  function finishButtonsHtml() {
    return '<div class="finish-buttons">' +
      '<button type="button" class="btn-quiet" id="prevStudentBtn">이전 학생</button>' +
      '<button type="button" class="btn-ink" id="finishStudentBtn">채점 끝, 다음 학생</button></div>';
  }
  function finishWarnText(pending) {
    return '아직 안 매긴 서술형이 있어요(' + pending.map(function (n) { return n + '번'; }).join(', ') + '). 완료하면 0점으로 보여요.';
  }

  function studentViewHtml() {
    var list = rosterOrder(teacherState.submissions);
    var sel = findSub(teacherState.selectedRowIndex);
    if (!sel) {
      sel = list.filter(function (s) { return !s.isCompleted; })[0] || list[0];
      teacherState.selectedRowIndex = sel.rowIndex;
    }
    var roster = list.map(function (s) {
      var on = s === sel;
      return '<tr data-row="' + Number(s.rowIndex) + '"' + (on ? ' class="is-selected"' : '') + '>' +
        '<td class="num">' + escapeHtml(s.studentNumber) + '</td>' +
        '<td class="name"><button type="button" class="roster-pick" data-pick-row="' + Number(s.rowIndex) + '" aria-pressed="' + on + '">' + escapeHtml(s.studentName) + '</button></td>' +
        '<td class="score">' + scoreCellHtml(s) + '</td></tr>';
    }).join('');
    var qs = teacherState.questions.slice().sort(function (a, b) { return a.qNum - b.qNum; });
    var sheet = qs.map(function (q) {
      var eff = effectiveMark(sel.rowIndex, q.qNum);
      var essay = q.qType === '서술형';
      return '<tr data-q="' + Number(q.qNum) + '"' + (eff && eff.status === '보류' ? ' class="is-pending"' : '') + '>' +
        '<td class="num">' + Number(q.qNum) + '</td>' +
        '<td class="answer">' + answerHtml(sel, q) + '</td>' +
        '<td class="correct' + (essay ? ' criteria' : '') + '">' + escapeHtml(q.rawAnswerStr) + '</td>' +
        '<td class="mark-td">' + markCellHtml(sel, q) + '</td></tr>';
    }).join('');
    var draft = commentDrafts[sel.rowIndex];
    var comment = draft !== undefined ? draft : (sel.teacherComment || '');
    return '<div class="grade-split">' +
      '<div class="table-wrap grade-roster-wrap"><table class="sheet-table roster-table" id="gradeRoster" aria-label="명렬표"><thead><tr>' +
      '<th>번호</th><th>이름</th><th>점수</th></tr></thead><tbody>' + roster + '</tbody></table></div>' +
      '<div class="grade-student">' +
      '<div class="grade-student-head"><h2 id="gradeStudentName" tabindex="-1">' + escapeHtml(sel.studentNumber) + '번 ' + escapeHtml(sel.studentName) + '</h2>' +
      '<span class="red-pen grade-student-total" id="gradeStudentTotal">' + fmtScore(sel.totalScore) + '점</span></div>' +
      '<div class="table-wrap"><table class="sheet-table" id="gradeSheet"><thead><tr>' +
      '<th class="num-col">번호</th><th>학생 답</th><th class="correct-col">정답</th><th class="mark-col">채점</th></tr></thead><tbody>' + sheet + '</tbody></table></div>' +
      '<label for="commentInput" class="visually-hidden">한 말씀</label>' +
      '<input type="text" id="commentInput" class="comment-input" maxlength="300" placeholder="한 말씀을 써 주세요" value="' + escapeHtml(comment) + '">' +
      '<div class="finish-area" id="finishArea">' + finishButtonsHtml() + '</div>' +
      '</div></div>';
  }

  function selectStudent(rowIndex, focusSelector) {
    teacherState.selectedRowIndex = Number(rowIndex);
    rerenderGradeKeepingFocus(focusSelector || null);
    if (!focusSelector && tEl('gradeStudentName')) tEl('gradeStudentName').focus();
  }

  // --- 부분 갱신 (채점 저장 뒤 전체 재렌더 없이) ---
  function paintCell(rowIndex, qNum, force) {
    var eff = effectiveMark(rowIndex, qNum);
    var st = eff ? eff.status : '';
    var cells = tEl('panelGrade').querySelectorAll('.grade-cell[data-row="' + Number(rowIndex) + '"][data-q="' + Number(qNum) + '"]');
    Array.prototype.forEach.call(cells, function (cell) {
      Array.prototype.forEach.call(cell.querySelectorAll('.mark-cell'), function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-mark') === st ? 'true' : 'false');
      });
      var input = cell.querySelector('.score-input');
      // 쓰고 있는 점수 칸은 덮지 않는다 (되돌릴 때만 덮는다)
      if (force || document.activeElement !== input) {
        input.value = st === '△' ? fmtScore(eff.earned) : '';
        delete input.dataset.armed;
      }
      var tr = cell.closest('tr');
      if (tr) tr.classList.toggle('is-pending', st === '보류');
    });
  }

  function paintRowSummary(rowIndex) {
    renderTopBar();
    var sub = findSub(rowIndex);
    if (!sub) return;
    var remain = tEl('gradeRemain');
    if (remain) {
      var info = questionHeadInfo(teacherState.selectedQNum);
      remain.textContent = info.pending + '명 남음';
      tEl('gradeAfterNote').hidden = !info.showNote;
      Array.prototype.forEach.call(document.querySelectorAll('#qPicker button[data-qnum]'), function (b) {
        var n = Number(b.getAttribute('data-qnum'));
        var p = countPendingForQuestion(teacherState.submissions, n) > 0;
        if (b.classList.contains('q-pick--pending') !== p) {
          b.classList.toggle('q-pick--pending', p);
          b.innerHTML = pickInner(n, p);
        }
      });
    }
    var scoreTd = document.querySelector('#gradeRoster tr[data-row="' + Number(rowIndex) + '"] td.score');
    if (scoreTd) scoreTd.innerHTML = scoreCellHtml(sub);
    if (Number(teacherState.selectedRowIndex) === Number(rowIndex) && tEl('gradeStudentTotal')) {
      tEl('gradeStudentTotal').textContent = fmtScore(sub.totalScore) + '점';
      refreshFinishWarning(sub);
    }
  }

  // 경고가 떠 있는데 남은 서술형을 다 매겼으면 원래 단추로 돌린다
  function refreshFinishWarning(sub) {
    var area = tEl('finishArea');
    if (!area || !area.querySelector('[data-finish]')) return;
    var pending = pendingQNums(sub);
    if (!pending.length) area.innerHTML = finishButtonsHtml();
    else area.querySelector('.finish-warn').textContent = finishWarnText(pending);
  }

  function showScoreError(cell, message) {
    var el = cell.querySelector('.score-error');
    el.textContent = message;
    el.hidden = false;
  }
  function clearScoreError(rowIndex, qNum) {
    var cells = tEl('panelGrade').querySelectorAll('.grade-cell[data-row="' + Number(rowIndex) + '"][data-q="' + Number(qNum) + '"] .score-error');
    Array.prototype.forEach.call(cells, function (el) { el.hidden = true; el.textContent = ''; });
  }

  // 채점 칸 하나 저장: 바로 표시 -> 서버 저장 -> 성공이면 그 행 데이터만 갱신, 실패면 저장된 값으로 되돌림
  function gradeCell(rowIndex, qNum, status, earned) {
    gradeBook();
    var sub = findSub(rowIndex), q = questionOf(qNum);
    if (!sub || !q) return Promise.resolve();
    var max = Number(q.points) || 0;
    if (status === 'O') earned = max;
    else if (status === 'X') earned = 0;
    else if (earned === undefined || earned === null) earned = Math.round(max / 2);
    var key = rowIndex + '|' + qNum;
    var c = gradeCells[key] || (gradeCells[key] = { seq: 0, done: true, shown: null });
    var seq = ++c.seq;
    c.done = false;
    c.shown = { status: status, earned: earned };
    paintCell(rowIndex, qNum);
    clearScoreError(rowIndex, qNum);
    if (Number(teacherState.selectedRowIndex) === Number(rowIndex)) refreshFinishWarning(sub);
    var session = teacherSession, rowKey = sub.rowKey;
    return runInRowQueue(rowIndex, async function () {
      if (session !== teacherSession) return;
      if (seq !== c.seq) return; // 그 뒤에 같은 칸을 또 눌렀다: 마지막 것만 보낸다
      var s = findSub(rowIndex);
      if (!s || s.rowKey !== rowKey) {
        c.done = true;
        paintCell(rowIndex, qNum, true);
        recordChangedElsewhere();
        return;
      }
      var payload = buildGradePayload(s, qNum, status, earned, max);
      var res;
      try {
        res = await serverCall('updateStudentQuestionGrade', payload);
      } catch (e) {
        res = { success: false, message: '연결을 확인해 주세요.' };
      }
      if (session !== teacherSession) return; // 그 사이 선생님 화면을 나갔다
      var latest = seq === c.seq;
      var cur = findSub(rowIndex);
      if (res && res.success && cur && cur.rowKey === rowKey) {
        cur.perQuestionMap = cur.perQuestionMap || {};
        cur.perQuestionMap[qNum] = payload.updatedQuestions[qNum];
        if (typeof res.newTotalScore === 'number') cur.totalScore = res.newTotalScore;
        cur.isCompleted = res.isCompleted === true;
        if (latest) c.done = true;
        paintCell(rowIndex, qNum);
        paintRowSummary(rowIndex);
        return;
      }
      if (res && res.success) { // 저장은 됐지만 그 사이 새로고침으로 기록이 바뀌었다
        c.done = true;
        recordChangedElsewhere();
        return;
      }
      if (latest) {
        c.done = true;
        paintCell(rowIndex, qNum, true);
        var curSub = findSub(rowIndex);
        if (curSub && Number(teacherState.selectedRowIndex) === Number(rowIndex)) refreshFinishWarning(curSub);
      }
      showToast('채점을 저장하지 못했어요. ' + ((res && res.message) || '다시 눌러 주세요.'), 'error');
    });
  }

  function onMarkClick(btn) {
    var cell = btn.closest('.grade-cell');
    var row = Number(cell.getAttribute('data-row')), qNum = Number(cell.getAttribute('data-q'));
    var mark = btn.getAttribute('data-mark');
    var input = cell.querySelector('.score-input');
    if (mark === '△') {
      // 점수는 칸에 쓰고 Enter/칸 밖으로 나가면 저장
      var q = questionOf(qNum);
      if (input.value.trim() === '') input.value = String(Math.round((Number(q && q.points) || 0) / 2));
      input.dataset.armed = '1';
      input.focus();
      input.select();
      return;
    }
    delete input.dataset.armed;
    gradeCell(row, qNum, mark);
  }

  function commitScore(input) {
    var cell = input.closest('.grade-cell');
    if (!cell) return;
    var row = Number(cell.getAttribute('data-row')), qNum = Number(cell.getAttribute('data-q'));
    var q = questionOf(qNum);
    if (!q) return;
    if (input.value.trim() === '' && input.dataset.armed !== '1') { clearScoreError(row, qNum); return; }
    var max = Number(q.points) || 0;
    var parsed = parsePartialScore(input.value, max);
    if (!parsed.ok) { showScoreError(cell, parsed.message); return; }
    delete input.dataset.armed;
    clearScoreError(row, qNum);
    var st = statusForScore(parsed.value, max);
    var eff = effectiveMark(row, qNum);
    if (eff && eff.status === st && Number(eff.earned) === parsed.value) return; // 바뀐 것 없음
    gradeCell(row, qNum, st, parsed.value);
  }

  function showFinishWarning(pending) {
    var area = tEl('finishArea');
    if (!area) return;
    area.innerHTML = '<p class="inline-note finish-warn" role="alert">' + escapeHtml(finishWarnText(pending)) + '</p>' +
      '<div class="finish-buttons">' +
      '<button type="button" class="btn-quiet" data-finish="commentOnly">한 말씀만 저장</button>' +
      '<button type="button" class="btn-ink" data-finish="complete">그래도 완료</button></div>';
    area.querySelector('[data-finish="commentOnly"]').focus();
  }

  // 채점 끝: auto 는 보류가 있으면 묻고, complete 는 완료로, commentOnly 는 한 말씀만 저장 (완료 상태는 서버 규칙대로)
  async function finishStudent(rowIndex, mode) {
    gradeBook();
    var sub = findSub(rowIndex);
    if (!sub) return;
    var fromAuto = mode === 'auto';
    if (fromAuto) {
      var pending = pendingQNums(sub);
      if (pending.length) { showFinishWarning(pending); return; }
      mode = 'complete';
    }
    var r = rowBook(rowIndex);
    if (r.finishing) return; // 저장 중에 또 눌러도 한 번만
    r.finishing = true;
    var area = tEl('finishArea');
    if (area) area.setAttribute('aria-busy', 'true');
    var isSelected = Number(teacherState.selectedRowIndex) === Number(rowIndex) && tEl('commentInput');
    var comment = isSelected ? tEl('commentInput').value : String(sub.teacherComment || '');
    var session = teacherSession, rowKey = sub.rowKey;
    // 앞서 누른 채점 칸 저장이 끝난 뒤에 보낸다
    var res = await runInRowQueue(rowIndex, async function () {
      if (session !== teacherSession) return null;
      var s = findSub(rowIndex);
      if (!s || s.rowKey !== rowKey) return { success: false, changed: true };
      if (fromAuto) {
        // 앞 저장이 끝난 뒤 저장된 값으로 다시 확인: 실패해 보류로 돌아간 칸이 있으면 완료하지 않는다
        var still = savedPendingQNums(s);
        if (still.length) return { warn: still };
      }
      var payload = { authPassword: teacherState.pw, rowIndex: s.rowIndex, rowKey: rowKey, teacherComment: comment };
      // 한 말씀만 저장은 완료 상태를 지금 값 그대로 둔다
      payload.forceComplete = mode === 'complete' ? true : s.isCompleted === true;
      try {
        return await serverCall('updateStudentQuestionGrade', payload);
      } catch (e) {
        return { success: false, message: '연결을 확인해 주세요.' };
      }
    });
    r.finishing = false;
    if (session !== teacherSession) return;
    if (area) area.removeAttribute('aria-busy');
    var cur = findSub(rowIndex);
    if (res && res.warn) {
      if (Number(teacherState.selectedRowIndex) === Number(rowIndex)) showFinishWarning(res.warn);
      return;
    }
    if ((res && res.changed) || (res && res.success && (!cur || cur.rowKey !== rowKey))) { recordChangedElsewhere(); return; }
    if (!res || !res.success) {
      showToast('저장하지 못했어요. ' + ((res && res.message) || '다시 눌러 주세요.'), 'error');
      return;
    }
    cur.teacherComment = comment.trim();
    if (typeof res.newTotalScore === 'number') cur.totalScore = res.newTotalScore;
    cur.isCompleted = res.isCompleted === true;
    delete commentDrafts[rowIndex];
    var msg = mode === 'commentOnly' ? '한 말씀을 저장했어요' : '채점을 끝냈어요';
    var onScreen = teacherState.gradeView === 'byStudent' && Number(teacherState.selectedRowIndex) === Number(rowIndex);
    var next = neighborRow(rowIndex, 1);
    if (onScreen && next) {
      selectStudent(next.rowIndex);
      renderTopBar();
      showToast(msg);
      return;
    }
    if (onScreen) {
      rerenderGradeKeepingFocus('#finishStudentBtn');
      renderTopBar();
      showToast(msg + '. 마지막 학생이에요');
      return;
    }
    paintRowSummary(rowIndex);
    showToast(msg);
  }

  function goPrevStudent() {
    var prev = neighborRow(teacherState.selectedRowIndex, -1);
    if (!prev) { showToast('첫 학생이에요'); return; }
    selectStudent(prev.rowIndex);
  }

  function onGradeClick(e) {
    var b = e.target.closest('button');
    if (!b || !tEl('panelGrade').contains(b)) return;
    if (b.hasAttribute('data-gview')) {
      teacherState.gradeView = b.getAttribute('data-gview');
      rerenderGradeKeepingFocus('#' + b.id);
    } else if (b.hasAttribute('data-qnum')) {
      teacherState.selectedQNum = Number(b.getAttribute('data-qnum'));
      rerenderGradeKeepingFocus('#qPicker button[data-qnum="' + teacherState.selectedQNum + '"]');
    } else if (b.hasAttribute('data-pick-row')) {
      var row = Number(b.getAttribute('data-pick-row'));
      selectStudent(row, '#gradeRoster button[data-pick-row="' + row + '"]');
    } else if (b.hasAttribute('data-mark')) {
      onMarkClick(b);
    } else if (b.id === 'prevStudentBtn') {
      goPrevStudent();
    } else if (b.id === 'finishStudentBtn') {
      finishStudent(teacherState.selectedRowIndex, 'auto');
    } else if (b.hasAttribute('data-finish')) {
      finishStudent(teacherState.selectedRowIndex, b.getAttribute('data-finish'));
    }
  }

  // ----- 결과 보기 탭 -----
  var clearAsked = false;
  var clearing = false;

  function pctText(v) { return String(Math.round((Number(v) || 0) * 10) / 10); }

  function renderResultsPanel() {
    var stats = teacherState.stats.filter(function (s) { return s.qType !== '서술형'; });
    var hasData = stats.some(function (s) { return Number(s.totalCount) > 0; });
    var html = '<h2 class="panel-h">문항별로 틀린 학생</h2>';
    if (!hasData) {
      html += '<p class="t-placeholder">제출이 쌓이면 문항별로 틀린 학생 수가 나와요.</p>';
    } else {
      html += '<div class="table-wrap"><table class="sheet-table stat-table"><thead><tr><th>번호</th><th>틀린 학생</th><th>가장 많이 쓴 오답</th></tr></thead><tbody>';
      stats.forEach(function (s) {
        var rate = Math.max(0, Math.min(100, Number(s.errorRate) || 0));
        var width = rate > 0 ? Math.max(2, rate) : 0;
        html += '<tr><td class="num">' + escapeHtml(s.qNum) + '</td>'
          + '<td><div class="bar-cell"><span class="ink-bar" style="width:' + (width * 1.4) + 'px"></span>'
          + '<span class="bar-text">' + escapeHtml(s.wrongCount) + '명 (' + pctText(rate) + '%)</span></div></td>'
          + '<td>' + escapeHtml(s.topWrongAnswer) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '<h2 class="panel-h">제출 명렬표</h2>';
    var subs = teacherState.submissions;
    if (!subs.length) {
      html += '<p class="t-placeholder">아직 제출한 학생이 없어요.</p>';
    } else {
      html += '<div class="table-wrap"><table class="sheet-table roster-all"><thead><tr><th>시간</th><th>번호</th><th>이름</th><th>총점</th><th>상태</th><th>문항별 요약</th></tr></thead><tbody>';
      subs.forEach(function (s) {
        html += '<tr><td class="nowrap">' + escapeHtml(s.time) + '</td>'
          + '<td class="num">' + escapeHtml(s.studentNumber) + '</td>'
          + '<td>' + escapeHtml(s.studentName) + '</td>'
          + '<td class="nowrap">' + escapeHtml(fmtScore(s.totalScore)) + '점</td>'
          + '<td class="nowrap">' + (s.isCompleted ? '완료' : '대기') + '</td>'
          + '<td>' + escapeHtml(s.summary).replace(/△/g, '<span class="glyph">△</span>') + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '<div class="clear-area" id="clearArea"></div>';
    tEl('panelResults').innerHTML = html;
    renderClearArea();
  }

  function renderClearArea() {
    var area = tEl('clearArea');
    if (!area) return;
    if (!clearAsked) {
      area.innerHTML = '<button type="button" class="btn-quiet" id="clearRecordsBtn">제출 기록 모두 지우기</button>';
    } else {
      area.innerHTML = '<p class="clear-ask" role="alert">정말 지울까요? 되돌릴 수 없어요.</p>'
        + '<div class="clear-btns"><button type="button" class="btn-ink" id="clearConfirmBtn">지우기</button>'
        + '<button type="button" class="btn-quiet" id="clearCancelBtn">그만두기</button></div>';
    }
  }

  function showClearNote(msg) {
    var area = tEl('clearArea');
    var n = area.querySelector('.inline-error');
    if (!n) { n = document.createElement('p'); n.className = 'inline-error'; n.setAttribute('role', 'status'); area.appendChild(n); }
    n.textContent = msg;
  }

  async function clearRecords() {
    if (clearing) return;
    if (gradeInflight > 0) { showClearNote(GRADE_BUSY_NOTE); return; }
    clearing = true;
    var btn = tEl('clearConfirmBtn');
    if (btn) btn.disabled = true;
    var session = teacherSession;
    var res;
    try {
      res = await serverCall('clearSubmissionRecords', teacherState.pw);
    } catch (e) {
      res = { success: false, message: '연결하지 못했어요. 다시 눌러 주세요.' };
    }
    clearing = false;
    if (session !== teacherSession) return;
    clearAsked = false;
    if (res && res.success) {
      resetGradeBook();
      showToast(res.message || '제출 기록을 모두 지웠어요.');
      await refreshTeacherData();
    } else {
      showToast((res && res.message) || '지우지 못했어요. 다시 눌러 주세요.', 'error');
      renderClearArea();
      var again = tEl('clearRecordsBtn');
      if (again) again.focus();
    }
  }

  function onResultsClick(e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'clearRecordsBtn') {
      clearAsked = true;
      renderClearArea();
      tEl('clearCancelBtn').focus();
    } else if (b.id === 'clearCancelBtn') {
      clearAsked = false;
      renderClearArea();
      tEl('clearRecordsBtn').focus();
    } else if (b.id === 'clearConfirmBtn') {
      clearRecords();
    }
  }

  // ----- 정답과 설정 탭 -----
  var QTYPES = ['객관식', '기호(ㄱ,ㄴ,ㄷ)', '기호(가,나,다)', 'OX퀴즈', '단답식', '서술형'];
  // 저장 전 편집본: 저장하지 않은 변경(dirty)이 있으면 다른 곳의 새로고침에도 다시 만들지 않는다
  var setupDraft = null;

  function buildSetupDraft() {
    var s = teacherState.settings || {};
    return {
      session: teacherSession, dirty: false, saving: false,
      questions: teacherState.questions.map(function (q) {
        return { origQNum: q.qNum, qType: q.qType, rawAnswerStr: q.rawAnswerStr || '', points: String(q.points), partialCredit: q.partialCredit === true, error: '' };
      }),
      settings: {
        examTitle: s.examTitle || '', teacherPassword: '', showScore: s.showScore === true,
        showCorrectAnswers: s.showCorrectAnswers === true, ignoreSpaces: s.ignoreSpaces === true, allowResubmit: s.allowResubmit === true
      }
    };
  }

  // 칸 수: 서술형은 1칸, 나머지는 쉼표(또는 옛 | )로 나눈 빈칸이 아닌 조각 수
  function blankCountOfDraft(q) {
    if (q.qType === '서술형') return 1;
    return Math.max(1, String(q.rawAnswerStr || '').split(/[,|]/).filter(function (p) { return p.trim() !== ''; }).length);
  }

  function setupRowCells(q, idx) {
    var n = idx + 1;
    var opts = QTYPES.map(function (t) {
      return '<option value="' + escapeHtml(t) + '"' + (q.qType === t ? ' selected' : '') + '>' + escapeHtml(t) + '</option>';
    }).join('');
    return '<td class="num">' + n + '</td>'
      + '<td><select class="setup-select" data-f="type" aria-label="' + n + '번 유형">' + opts + '</select></td>'
      + '<td class="blank-count">' + blankCountOfDraft(q) + '칸</td>'
      + '<td><input type="text" class="line-input setup-answer" data-f="answer" aria-label="' + n + '번 정답" value="' + escapeHtml(q.rawAnswerStr) + '"'
      + ' placeholder="' + (q.qType === '서술형' ? '채점 기준을 적어 두세요' : '예: 2, 4 또는 훈민정음/한글') + '">'
      + (q.error ? '<div class="inline-error row-error">' + escapeHtml(q.error) + '</div>' : '') + '</td>'
      + '<td><input type="number" class="line-input setup-points" data-f="points" aria-label="' + n + '번 배점" min="0" step="any" value="' + escapeHtml(q.points) + '"></td>'
      + '<td class="center"><input type="checkbox" class="setup-check" data-f="partial" aria-label="' + n + '번 부분점수"' + (q.partialCredit ? ' checked' : '') + '></td>'
      + '<td class="center"><button type="button" class="link-quiet" data-del aria-label="' + n + '번 삭제">삭제</button></td>';
  }

  function renderSetupRows() {
    tEl('setupRows').innerHTML = setupDraft.questions.map(function (q, i) {
      return '<tr data-idx="' + i + '">' + setupRowCells(q, i) + '</tr>';
    }).join('');
  }

  function switchHtml(id, label, on) {
    return '<label class="ink-switch"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '>'
      + '<span class="ink-switch__track"></span><span>' + label + '</span></label>';
  }

  function renderSetupPanel() {
    if (setupDraft && setupDraft.session !== teacherSession) setupDraft = null;
    if (setupDraft && setupDraft.dirty && tEl('setupRows')) return; // 쓰던 편집을 지키기
    setupDraft = buildSetupDraft();
    var st = setupDraft.settings;
    var fa = document.activeElement && tEl('panelSetup').contains(document.activeElement) ? document.activeElement : null;
    var focusSel = '';
    if (fa) {
      var fr = fa.closest('tr[data-idx]');
      if (fa.id) focusSel = '#' + fa.id;
      else if (fr && fa.getAttribute('data-f')) focusSel = 'tr[data-idx="' + fr.getAttribute('data-idx') + '"] [data-f="' + fa.getAttribute('data-f') + '"]';
      else if (fr && fa.hasAttribute('data-del')) focusSel = 'tr[data-idx="' + fr.getAttribute('data-idx') + '"] [data-del]';
    }
    tEl('panelSetup').innerHTML =
      '<h2 class="panel-h">정답표</h2>'
      + '<p class="rule-line">쉼표(,)로 나누면 빈칸이 늘어나요. 예: 2, 4</p>'
      + '<p class="rule-line">빗금(/)으로 묶으면 둘 다 정답이에요. 예: 훈민정음/한글</p>'
      + '<fieldset class="setup-fields" id="setupFields">'
      + '<div class="table-wrap"><table class="sheet-table setup-table"><thead><tr>'
      + '<th>번호</th><th>유형</th><th>칸 수</th><th>정답</th><th>배점</th><th>부분점수</th><th>삭제</th>'
      + '</tr></thead><tbody id="setupRows"></tbody></table></div>'
      + '<p class="inline-error" id="setupRowNote" role="status" hidden></p>'
      + '<p class="setup-add"><button type="button" class="btn-quiet" id="addQuestionBtn">문항 추가</button></p>'
      + '<h2 class="panel-h">설정</h2>'
      + '<div class="setup-grid">'
      + '<label class="setup-field"><span class="pw-label">시험 제목</span><input type="text" class="line-input" id="cfgExamTitle" value="' + escapeHtml(st.examTitle) + '" placeholder="우리들의 답안지"></label>'
      + '<label class="setup-field"><span class="pw-label">선생님 비밀번호</span><input type="password" class="line-input" id="cfgTeacherPw" autocomplete="new-password" placeholder="비워 두면 지금 비밀번호 그대로예요"></label>'
      + '</div>'
      + '<div class="setup-switches">'
      + switchHtml('cfgShowScore', '점수와 ○/ 보여주기', st.showScore)
      + switchHtml('cfgShowCorrectAnswers', '틀린 문제 정답 보여주기', st.showCorrectAnswers)
      + switchHtml('cfgIgnoreSpaces', '띄어쓰기 무시하고 채점', st.ignoreSpaces)
      + switchHtml('cfgAllowResubmit', '다시 내기 허용', st.allowResubmit)
      + '</div></fieldset>'
      + '<p class="setup-dirty" id="setupDirty" role="status" hidden>저장하지 않은 변경이 있어요</p>'
      + '<p class="inline-error" id="setupError" hidden></p>'
      + '<p class="setup-save"><button type="button" class="btn-ink" id="setupSaveBtn">저장</button></p>';
    renderSetupRows();
    var fel = focusSel ? tEl('panelSetup').querySelector(focusSel) : null;
    if (fel) fel.focus(); // 새로고침으로 다시 그려도 포커스를 지킨다
  }

  function markSetupDirty() {
    setupDraft.dirty = true;
    tEl('setupDirty').hidden = false;
    tEl('setupError').hidden = true;
  }

  function setupRowOf(el) {
    var tr = el.closest('tr[data-idx]');
    return tr ? { tr: tr, idx: Number(tr.getAttribute('data-idx')) } : null;
  }

  function clearRowError(row) {
    setupDraft.questions[row.idx].error = '';
    var err = row.tr.querySelector('.row-error');
    if (err) err.remove();
  }

  function onSetupInput(e) {
    if (!setupDraft || setupDraft.saving) return;
    var t = e.target;
    var f = t.getAttribute('data-f');
    var row = setupRowOf(t);
    if (row && (f === 'answer' || f === 'points')) {
      var q = setupDraft.questions[row.idx];
      if (f === 'answer') {
        q.rawAnswerStr = t.value;
        row.tr.querySelector('.blank-count').textContent = blankCountOfDraft(q) + '칸'; // 입력 중에는 이 셀만 바꾼다
      } else {
        q.points = t.value;
      }
      clearRowError(row);
      markSetupDirty();
    } else if (t.id === 'cfgExamTitle') {
      setupDraft.settings.examTitle = t.value; markSetupDirty();
    } else if (t.id === 'cfgTeacherPw') {
      setupDraft.settings.teacherPassword = t.value; markSetupDirty();
    }
  }

  function onSetupChange(e) {
    if (!setupDraft || setupDraft.saving) return;
    var t = e.target;
    var f = t.getAttribute('data-f');
    var row = setupRowOf(t);
    if (row && f === 'type') {
      setupDraft.questions[row.idx].qType = t.value;
      row.tr.innerHTML = setupRowCells(setupDraft.questions[row.idx], row.idx); // 그 행만 다시 그린다
      row.tr.querySelector('[data-f="type"]').focus();
      markSetupDirty();
    } else if (row && f === 'partial') {
      setupDraft.questions[row.idx].partialCredit = t.checked; markSetupDirty();
    } else if (/^cfg(ShowScore|ShowCorrectAnswers|IgnoreSpaces|AllowResubmit)$/.test(t.id)) {
      var key = t.id.charAt(3).toLowerCase() + t.id.slice(4);
      setupDraft.settings[key] = t.checked; markSetupDirty();
    }
  }

  function addSetupRow() {
    setupDraft.questions.push({ origQNum: null, qType: '객관식', rawAnswerStr: '1', points: '20', partialCredit: false, error: '' });
    tEl('setupRowNote').hidden = true;
    var idx = setupDraft.questions.length - 1;
    var tr = document.createElement('tr');
    tr.setAttribute('data-idx', String(idx));
    tr.innerHTML = setupRowCells(setupDraft.questions[idx], idx);
    tEl('setupRows').appendChild(tr);
    markSetupDirty();
    tr.querySelector('[data-f="type"]').focus();
  }

  function removeSetupRow(idx) {
    var note = tEl('setupRowNote');
    if (setupDraft.questions.length <= 1) {
      note.textContent = '문항은 하나 이상 있어야 해요.';
      note.hidden = false;
      return;
    }
    note.hidden = true;
    setupDraft.questions.splice(idx, 1);
    renderSetupRows();
    markSetupDirty();
    var btns = tEl('setupRows').querySelectorAll('[data-del]');
    btns[Math.min(idx, btns.length - 1)].focus();
  }

  // 저장 전 확인: 문제가 있는 행에 인라인 오류를 달고 첫 문제 입력 칸을 돌려준다
  function validateSetup() {
    var firstBad = null;
    setupDraft.questions.forEach(function (q, i) {
      var msg = '';
      var pts = String(q.points).trim();
      var answerBad = q.qType !== '서술형' && !String(q.rawAnswerStr).trim();
      if (answerBad) msg = '정답을 적어 주세요.';
      else if (pts === '' || !isFinite(Number(pts)) || Number(pts) < 0) msg = '배점을 0 이상의 숫자로 적어 주세요.';
      q.error = msg;
      var tr = tEl('setupRows').querySelector('tr[data-idx="' + i + '"]');
      var old = tr.querySelector('.row-error');
      if (old) old.remove();
      if (msg) {
        tr.querySelector('[data-f="answer"]').parentNode.insertAdjacentHTML('beforeend', '<div class="inline-error row-error">' + escapeHtml(msg) + '</div>');
        if (!firstBad) firstBad = tr.querySelector(answerBad ? '[data-f="answer"]' : '[data-f="points"]');
      }
    });
    return firstBad;
  }

  async function saveSetup() {
    var d = setupDraft;
    if (!d || d.saving) return;
    // 채점·결과 공개 저장이 끝나기 전에는 보내지 않는다 (설정 저장은 결과 공개 값도 다시 쓴다)
    if (gradeInflight > 0 || publishing) {
      var busy = tEl('setupError');
      busy.textContent = publishing ? PUBLISH_BUSY_NOTE : GRADE_BUSY_NOTE;
      busy.hidden = false;
      return;
    }
    var bad = validateSetup();
    if (bad) {
      var err = tEl('setupError');
      err.textContent = '표시된 곳을 고치고 다시 저장해 주세요.';
      err.hidden = false;
      bad.focus();
      return;
    }
    tEl('setupError').hidden = true;
    var pw = d.settings.teacherPassword.trim() || teacherState.pw;
    var settings = {
      examTitle: d.settings.examTitle.trim() || '우리들의 답안지',
      teacherPassword: pw,
      publishResults: teacherState.settings.publishResults === true,
      showScore: d.settings.showScore,
      showCorrectAnswers: d.settings.showCorrectAnswers,
      ignoreSpaces: d.settings.ignoreSpaces,
      allowResubmit: d.settings.allowResubmit,
      omrTheme: 'blue'
    };
    var questions = d.questions.map(function (q, i) {
      return { qNum: i + 1, origQNum: q.origQNum, qType: q.qType, rawAnswerStr: q.rawAnswerStr.trim(), points: Number(String(q.points).trim()), partialCredit: q.partialCredit };
    });
    d.saving = true;
    tEl('setupSaveBtn').disabled = true;
    tEl('setupFields').disabled = true; // 저장하는 동안은 고칠 수 없다 (origQNum 이 어긋나지 않게)
    var session = teacherSession;
    var res;
    try {
      res = await serverCall('saveTeacherConfig', { authPassword: teacherState.pw, settings: settings, questions: questions });
    } catch (e) {
      res = null;
    }
    if (session !== teacherSession) return;
    d.saving = false;
    var btn = tEl('setupSaveBtn'), fields = tEl('setupFields');
    if (btn) btn.disabled = false;
    if (fields) fields.disabled = false;
    if (!res || !res.success) {
      showToast((res && res.message) || '저장하지 못했어요. 연결을 확인해 주세요.', 'error');
      return;
    }
    // 저장한 내용을 먼저 상태에 반영하고, 서버 값으로 다시 맞춘다
    teacherState.pw = pw;
    teacherState.settings = Object.assign({}, teacherState.settings, settings);
    teacherState.questions = questions.map(function (q) {
      return { qNum: q.qNum, qType: q.qType, blankCount: blankCountOfDraft(q), rawAnswerStr: q.rawAnswerStr, points: q.points, partialCredit: q.partialCredit };
    });
    setupDraft = null;
    studentReloadNeeded = true;
    resetGradeBook();
    renderTopBar();
    if (teacherState.tab === 'setup') { renderSetupPanel(); tEl('setupSaveBtn').focus(); }
    showToast('저장했어요');
    refreshTeacherData();
  }

  function onSetupClick(e) {
    var b = e.target.closest('button');
    if (!b || !setupDraft || setupDraft.saving) return;
    if (b.id === 'addQuestionBtn') addSetupRow();
    else if (b.id === 'setupSaveBtn') saveSetup();
    else if (b.hasAttribute('data-del')) removeSetupRow(setupRowOf(b).idx);
  }

  // ----- 이벤트 -----
  tEl('tabGrade').parentNode.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tab]');
    if (!btn) return;
    switchTab(btn.getAttribute('data-tab'));
    refreshTeacherData(); // 탭을 옮길 때마다 새 제출을 불러온다
  });
  tEl('tabGrade').parentNode.addEventListener('keydown', onTabKeydown);
  tEl('publishSwitch').addEventListener('change', function (e) { togglePublish(e.target.checked); });
  tEl('toStudentBtn').addEventListener('click', leaveTeacherMode);
  tEl('refreshBtn').addEventListener('click', function () { refreshTeacherData(); });
  tEl('panelGrade').addEventListener('click', onGradeClick);
  tEl('panelGrade').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.classList.contains('score-input')) { e.preventDefault(); commitScore(e.target); }
  });
  // blur 는 버블링하지 않으므로 캡처 단계에서 받는다
  tEl('panelGrade').addEventListener('blur', function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains('score-input')) return;
    var to = e.relatedTarget;
    if (to && to.classList && to.classList.contains('mark-cell') && t.closest('.grade-cell').contains(to)) return; // 같은 칸의 다른 표시를 누르는 중
    commitScore(t);
  }, true);
  tEl('panelGrade').addEventListener('input', function (e) {
    if (e.target.id === 'commentInput') commentDrafts[teacherState.selectedRowIndex] = e.target.value;
  });
  tEl('panelResults').addEventListener('click', onResultsClick);
  tEl('panelSetup').addEventListener('input', onSetupInput);
  tEl('panelSetup').addEventListener('change', onSetupChange);
  tEl('panelSetup').addEventListener('click', onSetupClick);
  tEl('pwOkBtn').addEventListener('click', function () { confirmTeacherLogin(); });
  tEl('pwCancelBtn').addEventListener('click', closeTeacherLogin);
  tEl('passwordModal').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); closeTeacherLogin(); return; }
    if (e.key === 'Enter' && e.target === tEl('teacherPwInput')) { e.preventDefault(); confirmTeacherLogin(); return; }
    if (e.key === 'Tab') {
      // 쪽지 안에서만 포커스가 돈다
      var items = [tEl('teacherPwInput'), tEl('pwCancelBtn'), tEl('pwOkBtn')].filter(function (el) { return !el.disabled; });
      var first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
</script>
